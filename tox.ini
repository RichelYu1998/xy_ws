[tox]
# tox 配置文件 - 用于多 Python 版本兼容性测试
# 使用方法: tox (自动测试所有列出的版本)
#         tox -e py39 (只测试 Python 3.9)
envlist = 
    py39,
    py310,
    py311,
    py312,
    py313,
    py314

skip_missing_interpreters = true

[testenv]
# 测试环境配置
description = 测试 Python {basepython} 版本兼容性

# 依赖安装
deps = 
    -r requirements.txt
    pytest>=7.0.0
    pytest-cov>=4.0.0

# 设置环境变量
setenv =
    PYTHONPATH = {toxinidir}
    TESTING = true

# 测试命令
commands =
    # 1. 运行版本检查脚本
    python check_python_version.py
    
    # 2. 运行单元测试（如果存在）
    python -m pytest tests/ -v --tb=short --cov=. --cov-report=term-missing {posargs}

# 指定要测试的目录
changedir = {toxinidir}

[testenv:clean]
# 清理环境
description = 清理测试生成的文件
skip_install = true
deps =
commands =
    python -c "import shutil; [shutil.rmtree(d, ignore_errors=True) for d in ['.pytest_cache', '__pycache__', '.coverage', 'htmlcov']]"
    echo ✅ 清理完成

[testenv:report]
# 生成测试报告
description = 生成覆盖率报告
skip_install = true
deps = coverage[toml]>=7.0.0
commands =
    coverage html -d htmlcov
    echo 📊 报告已生成: htmlcov/index.html

[flake8]
# 代码风格检查配置
max-line-length = 120
exclude = 
    .git,
    __pycache__,
    .venv,
    .tox,
    *.egg-info,
    build,
    dist

[pytest]
# pytest 配置
testpaths = tests
python_files = test_*.py
python_classes = Test*
python_functions = test_*
addopts = -v --tb=short
filterwarnings =
    ignore::DeprecationWarning